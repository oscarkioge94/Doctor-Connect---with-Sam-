version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: medflow_postgres
    restart: always
    environment:
      POSTGRES_USER: clinic_admin
      POSTGRES_PASSWORD: clinic_password_2026
      POSTGRES_DB: medflow_clinic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: medflow_fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://clinic_admin:clinic_password_2026@db:5432/medflow_clinic_db
      - JWT_SECRET=medflow-clinic-jwt-secret-key-2026
      - AFRICASTALKING_USERNAME=sandbox
      - AFRICASTALKING_API_KEY=
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
